[platformio]
src_dir = src
lib_dir = lib
test_dir = test

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    256dpi/MQTT @ ^2.5.2
    bblanchon/ArduinoJson @ ^7.0.0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Ilib/water_logic
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
lib_ignore =
    OneWire
    DallasTemperature
    MQTT
